name: Release

# 打 tag 触发：合并 src/ 模块、按 tag 写头部版本号，把构建产物直接作为 Release 资产发布。
# 产物不入库（见 .gitignore），所以不需要提交产物、也不需要移动 tag。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish userscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # 发布作业不装依赖，不需要缓存；开着只会多一条缓存投毒面
          package-manager-cache: false

      - name: Build userscript
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "::error::tag '${TAG}' 不是合法的版本 tag，应形如 v1.2.3"
            exit 1
          fi

          # 合并 src/ 模块，头部 @version 写成 tag 版本号
          node build.js --version "$VERSION"

          if ! grep -qxF "// @version      ${VERSION}" script.js; then
            echo "::error::script.js 头部没有写入版本号 ${VERSION}"
            exit 1
          fi

          grep -n '// @version' script.js
          cp script.js luogu-jumper.user.js

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude="${TAG}" HEAD 2>/dev/null || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "## 更新内容（${PREV_TAG} → ${TAG}）" > notes.md
          else
            RANGE="HEAD"
            echo "## 首次发布（${TAG}）" > notes.md
          fi
          echo >> notes.md

          git log "$RANGE" --no-merges \
            --invert-grep --grep='^chore: update version number to ' \
            --pretty=format:'- %s (%h)' >> notes.md || true
          echo >> notes.md

          cat notes.md

      - name: Create Release and upload the userscript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" luogu-jumper.user.js --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag \
              luogu-jumper.user.js
          fi
