name: Release

# 打 tag 触发：合并 src/ 模块 → 写头部版本号 → 提交版本号 → 移动 tag → 发布 Release。
# tag 被移动到版本号提交后本工作流会再跑一次，此时产物已经带上版本号，
# 直接跳过提交和移动 tag，只把 Release 资产更新掉，因此不会来回循环。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish userscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build userscript
        id: build
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "::error::tag '${TAG}' 不是合法的版本 tag，应形如 v1.2.3"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          # 切到默认分支的本地分支，后面的提交和推送都基于它
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          echo "changed=false" >> "$GITHUB_OUTPUT"

          # tag 指向版本号提交、且产物已经带着这个版本号，
          # 说明版本号提交和移动 tag 都做过了（本工作流就是被那次移动 tag 触发的）
          TAG_COMMIT_MESSAGE="$(git log -1 --format=%s "refs/tags/${TAG}")"
          if grep -qxF "// @version      ${VERSION}" script.js \
            && [ "$TAG_COMMIT_MESSAGE" = "chore: update version number to ${VERSION}" ]; then
            echo "::notice::script.js 的 @version 已是 ${VERSION}，且 ${TAG} 已指向版本号提交，跳过版本号提交"
            exit 0
          fi

          node build.js --version "$VERSION"
          grep -n '// @version' script.js

          if git diff --quiet -- script.js; then
            echo "::notice::合并结果与已提交的 script.js 一致，跳过版本号提交"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the version number
        if: steps.build.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.build.outputs.VERSION }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add script.js
          if git diff --cached --quiet; then
            echo "::notice::没有需要提交的改动"
            exit 0
          fi

          git commit -m "chore: update version number to ${VERSION}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Move the tag to the version number commit
        if: steps.build.outputs.changed == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" > tag-message.txt
            git tag -f -a "$TAG" -F tag-message.txt
            rm -f tag-message.txt
          else
            git tag -f "$TAG"
          fi

          git push -f origin "refs/tags/${TAG}"

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude="${TAG}" HEAD 2>/dev/null || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "## 更新内容（${PREV_TAG} → ${TAG}）" > notes.md
          else
            RANGE="HEAD"
            echo "## 首次发布（${TAG}）" > notes.md
          fi
          echo >> notes.md

          git log "$RANGE" --no-merges \
            --invert-grep --grep='^chore: update version number to ' \
            --pretty=format:'- %s (%h)' >> notes.md || true
          echo >> notes.md

          cat notes.md

      - name: Prepare userscript asset
        run: cp script.js luogu-jumper.user.js

      - name: Create Release and upload the userscript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" luogu-jumper.user.js --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag \
              luogu-jumper.user.js
          fi
